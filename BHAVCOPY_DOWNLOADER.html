<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="x-poe-datastore-behavior" content="local_only">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: 
        https://cdnjs.cloudflare.com 
        https://cdn.jsdelivr.net 
        https://code.jquery.com 
        https://unpkg.com 
        https://d3js.org 
        https://threejs.org 
        https://cdn.plot.ly 
        https://stackpath.bootstrapcdn.com 
        https://maps.googleapis.com 
        https://cdn.tailwindcss.com 
        https://ajax.googleapis.com 
        https://kit.fontawesome.com 
        https://cdn.datatables.net 
        https://maxcdn.bootstrapcdn.com 
        https://code.highcharts.com 
        https://tako-static-assets-production.s3.amazonaws.com 
        https://www.youtube.com 
        https://fonts.googleapis.com 
        https://fonts.gstatic.com 
        https://pfst.cf2.poecdn.net 
        https://puc.poecdn.net 
        https://i.imgur.com 
        https://wikimedia.org 
        https://*.icons8.com 
        https://*.giphy.com 
        https://picsum.photos 
        https://images.unsplash.com 
        https://nse-bhavcopy-cache.public.blob.vercel-storage.com;
        frame-src 'self' https://www.youtube.com https://trytako.com;
        child-src 'self';
        manifest-src 'self';
        worker-src 'self';
        upgrade-insecure-requests;
        block-all-mixed-content;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSE F&O Bhavcopy Downloader</title>
  <style>
    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121212;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      color: #e0e0e0;
    }
    .container {
      background: #1e1e1e;
      padding: 2rem 3rem;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      max-width: 600px;
      width: 95%;
      text-align: center;
    }
    h1 { font-size: 1.6rem; margin-bottom: 1.2rem; color: #f5f5f5; }
    section { margin: 1.5rem 0; padding: 1rem; border: 1px solid #333; border-radius: 8px; background: #181818; text-align: left; }
    h2 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #e0e0e0; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #bbbbbb; }
    input[type="date"] { padding: 0.6rem; font-size: 1rem; border: 1px solid #444; border-radius: 6px; margin-bottom: 0.6rem; background: #2a2a2a; color: #ddd; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    button { background: linear-gradient(90deg, #0057b8, #003f88); color: white; padding: 0.7rem 1.2rem; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 500; cursor: pointer; margin-top: 0.5rem; }
    button:hover { opacity: 0.85; }
    .btn-download { display: block; width: 100%; margin-top: 1rem; padding: 1rem; font-size: 1rem; }
    #datesList span { display: inline-block; background: #333; padding: 0.3rem 0.6rem; border-radius: 4px; margin: 0.2rem; }
    #status { margin-top: 1rem; min-height: 20px; text-align: center; }
    #status.loading { color: #ffb74d; }
    #status.success { color: #66bb6a; }
    #status.error { color: #ef5350; }
    footer { margin-top: 2rem; font-size: 0.75rem; color: #777; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>NSE F&O Bhavcopy Downloader</h1>

    <!-- Single Date -->
    <section>
      <h2>Single Date</h2>
      <label for="singleDate">Pick a Date</label>
      <input type="date" id="singleDate" max="">
      <button onclick="downloadSingle()">Download</button>
    </section>

    <!-- Date Range -->
    <section>
      <h2>Date Range</h2>
      <label for="fromDate">From</label>
      <input type="date" id="fromDate" max="">
      <label for="toDate">To</label>
      <input type="date" id="toDate" max="">
      <button onclick="downloadRange()">Download Range</button>
    </section>

    <!-- Arbitrary Dates -->
    <section>
      <h2>Arbitrary Dates</h2>
      <label for="pickDate">Select Date</label>
      <input type="date" id="pickDate" max="">
      <button onclick="addDate()">Add</button>
      <div id="datesList">(No dates added)</div>
      <button class="btn-download" onclick="downloadArbitrary()">Download Selected Dates</button>
    </section>

    <div id="status"></div>
  </div>

  <footer>
    © 2025 Your Trading Firm. All rights reserved.
  </footer>

  <script>
    const API_BASE = "/api/fno-bhavcopy";

    // Limit date inputs to today
    const today = new Date().toISOString().split("T")[0];
    ["singleDate", "fromDate", "toDate", "pickDate"].forEach(id => {
      document.getElementById(id).max = today;
    });

    const status = document.getElementById("status");

    // 🔑 Updated fetchAndDownload: follows redirect → forces browser download
    async function fetchAndDownload(dateStr) {
      const url = `${API_BASE}?date_str=${dateStr}`;
      const response = await fetch(url, { redirect: "follow" });
      if (!response.ok) throw new Error(`Unavailable: ${dateStr}`);

      const finalUrl = response.url; // Blob CDN URL

      const a = document.createElement("a");
      a.href = finalUrl;
      a.download = `fno_bhavcopy_${dateStr}.csv`; // suggest filename
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function formatDate(date) {
      return date.toISOString().split("T")[0];
    }

    async function downloadSingle() {
      const date = document.getElementById("singleDate").value;
      if (!date) { status.textContent = "⚠️ Select a date."; status.className = "error"; return; }
      try {
        status.textContent = "⏳ Fetching...";
        status.className = "loading";
        await fetchAndDownload(date);
        status.textContent = "✅ Download started.";
        status.className = "success";
      } catch (err) {
        status.textContent = `❌ ${err.message}`;
        status.className = "error";
      }
    }

    async function downloadRange() {
      const fromDate = document.getElementById("fromDate").value;
      const toDate = document.getElementById("toDate").value;
      if (!fromDate || !toDate) { status.textContent = "⚠️ Select both dates."; status.className = "error"; return; }
      const from = new Date(fromDate); const to = new Date(toDate);
      if (from > to) { status.textContent = "⚠️ From Date cannot be after To Date."; status.className = "error"; return; }

      let current = new Date(from); let count = 0;
      status.textContent = "⏳ Downloading range..."; status.className = "loading";
      while (current <= to) {
        try { await fetchAndDownload(formatDate(current)); count++; } catch (err) { console.warn(err.message); }
        current.setDate(current.getDate() + 1);
      }
      status.textContent = `✅ Downloads triggered for ${count} date(s).`; status.className = "success";
    }

    let selectedDates = [];
    function addDate() {
      const date = document.getElementById("pickDate").value;
      if (!date) return;
      if (!selectedDates.includes(date)) selectedDates.push(date);
      updateDatesList();
    }
    function updateDatesList() {
      const listEl = document.getElementById("datesList");
      listEl.innerHTML = selectedDates.length === 0 ? "(No dates added)" :
        selectedDates.map(d => `<span>${d}</span>`).join(" ");
    }
    async function downloadArbitrary() {
      if (selectedDates.length === 0) { status.textContent = "⚠️ No dates selected."; status.className = "error"; return; }
      status.textContent = "⏳ Downloading files..."; status.className = "loading";
      let count = 0;
      for (const d of selectedDates) {
        try { await fetchAndDownload(d); count++; } catch (err) { console.warn(err.message); }
      }
      status.textContent = `✅ Downloads triggered for ${count} date(s).`; status.className = "success";
    }
  </script>
</body>
</html>
