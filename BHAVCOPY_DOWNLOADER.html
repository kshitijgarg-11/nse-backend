<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSE F&O Bhavcopy Downloader</title>
  <style>
    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #0b0f14, #131a24 70%);
      margin: 0;
      padding: 2rem 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #e6edf7;
    }
    .container {
      background: rgba(24, 28, 38, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
      max-width: 720px;
      width: 95%;
    }
    h1 {
      font-size: 1.7rem;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #2dd4bf;
      font-weight: 600;
    }
    section {
      margin: 1rem 0;
      padding: 1rem;
      border-radius: 10px;
      background: #1a1f29;
      box-shadow: inset 0 0 4px rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
    }
    h2 {
      font-size: 1.05rem;
      margin-bottom: 0.8rem;
      color: #d1d5db;
      border-left: 3px solid #2dd4bf;
      padding-left: 0.5rem;
      font-weight: 500;
    }
    label {
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: #aab3c5;
    }
    input[type="date"] {
      padding: 0.55rem;
      font-size: 0.95rem;
      border: 1px solid #333a48;
      border-radius: 6px;
      background: #262e3f;
      color: #f1f5f9;
      margin-bottom: 0.6rem;
      outline: none;
    }
    input[type="date"]:focus {
      border-color: #2dd4bf;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
    button {
      background: linear-gradient(90deg, #2dd4bf, #0d9488);
      color: white;
      padding: 0.65rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 0.3rem;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-download {
      width: 100%;
      margin-top: 1rem;
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 8px;
    }
    #datesList {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #d1d5db;
    }
    #datesList span {
      display: inline-block;
      background: #2a3446;
      padding: 0.25rem 0.55rem;
      border-radius: 5px;
      margin: 0.2rem;
      color: #2dd4bf;
      font-size: 0.8rem;
      border: 1px solid rgba(45,212,191,0.3);
    }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 20px;
      text-align: center;
    }
    #status.loading { color: #fbbf24; }
    #status.success { color: #2dd4bf; }
    #status.error { color: #ef4444; }

    /* Progress */
    .progress-wrapper {
      margin-top: 1.2rem;
    }
    .progress-label {
      font-size: 0.9rem;
      color: #aab3c5;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .progress-container {
      width: 100%;
      background: #2a3446;
      border-radius: 6px;
      height: 20px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2dd4bf, #0d9488);
      text-align: center;
      font-size: 0.75rem;
      color: #fff;
      transition: width 0.3s ease;
    }

    /* Status list */
    #statusList {
      margin-top: 1rem;
      text-align: left;
      font-size: 0.8rem;
      max-height: 160px;
      overflow-y: auto;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 0.5rem;
    }
    #statusList div.success { color: #2dd4bf; }
    #statusList div.skipped { color: #9ca3af; }
    #statusList div.error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>NSE F&O Bhavcopy Downloader</h1>

    <!-- Single Date -->
    <section>
      <h2>Single Date</h2>
      <label for="singleDate">Pick a Date</label>
      <input type="date" id="singleDate" max="">
      <button onclick="downloadSingle()">Download</button>
    </section>

    <!-- Date Range -->
    <section>
      <h2>Date Range</h2>
      <label for="fromDate">From</label>
      <input type="date" id="fromDate" max="">
      <label for="toDate">To</label>
      <input type="date" id="toDate" max="">
      <button onclick="downloadRange()">Download Range</button>
    </section>

    <!-- Arbitrary Dates -->
    <section>
      <h2>Arbitrary Dates</h2>
      <label for="pickDate">Select Date</label>
      <input type="date" id="pickDate" max="">
      <button onclick="addDate()">Add</button>
      <div id="datesList">(No dates added)</div>
      <button class="btn-download" onclick="downloadArbitrary()">Download Selected Dates</button>
    </section>

    <div id="status"></div>

    <!-- Progress bar with label -->
    <div class="progress-wrapper">
      <div class="progress-label">Progress</div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar">0%</div>
      </div>
    </div>

    <div id="statusList"></div>
  </div>

  <script>
    const API_BASE = "/api/fno-bhavcopy";
    const today = new Date().toISOString().split("T")[0];
    ["singleDate", "fromDate", "toDate", "pickDate"].forEach(id => {
      document.getElementById(id).max = today;
    });

    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const statusList = document.getElementById("statusList");

    function updateProgress(completed, total) {
      const percent = Math.round((completed / total) * 100);
      progressBar.style.width = percent + "%";
      progressBar.textContent = percent + "%";
    }
    function addStatus(date, msg, cls) {
      const row = document.createElement("div");
      row.textContent = `${date}: ${msg}`;
      row.className = cls;
      statusList.appendChild(row);
    }
    function formatDate(date) {
      return date.toISOString().split("T")[0];
    }
    async function fetchAndDownload(dateStr) {
      const response = await fetch(`${API_BASE}?date_str=${dateStr}`);
      if (!response.ok) throw new Error("Unavailable");
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `fno_bhavcopy_${dateStr}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function downloadSingle() {
      const date = document.getElementById("singleDate").value;
      if (!date) return;
      progressBar.style.width="0%";
      progressBar.textContent="0%";
      statusList.innerHTML="";
      try{
        status.textContent="⏳ Fetching...";
        status.className="loading";
        await fetchAndDownload(date);
        updateProgress(1,1);
        addStatus(date,"Downloaded","success");
        status.textContent="✅ Download complete.";
        status.className="success";
      }catch{
        updateProgress(1,1);
        addStatus(date,"Unavailable","error");
        status.textContent="❌ File unavailable.";
        status.className="error";
      }
    }

    async function downloadRange() {
      const fromDate=document.getElementById("fromDate").value;
      const toDate=document.getElementById("toDate").value;
      if(!fromDate||!toDate)return;
      const from=new Date(fromDate);
      const to=new Date(toDate);
      if(from>to)return;
      let cur=new Date(from); const dates=[];
      while(cur<=to){dates.push(formatDate(cur));cur.setDate(cur.getDate()+1);}
      await batchDownload(dates);
    }

    let selectedDates=[];
    function addDate(){
      const d=document.getElementById("pickDate").value;
      if(d&&!selectedDates.includes(d))selectedDates.push(d);
      updateDatesList();
    }
    function updateDatesList(){
      const el=document.getElementById("datesList");
      el.innerHTML=selectedDates.length?
        selectedDates.map(d=>`<span>${d}</span>`).join(" "):
        "(No dates added)";
    }
    async function downloadArbitrary(){
      if(selectedDates.length===0)return;
      await batchDownload(selectedDates);
    }

    async function batchDownload(dates){
      progressBar.style.width="0%";
      progressBar.textContent="0%";
      statusList.innerHTML="";
      status.textContent="⏳ Downloading...";
      status.className="loading";

      let completed=0;
      const total=dates.length;
      for(const d of dates){
        const day=new Date(d).getDay();
        if(day===0||day===6){
          addStatus(d,"Skipped (Weekend)","skipped");
        }else{
          try{await fetchAndDownload(d);addStatus(d,"Downloaded","success");}
          catch{addStatus(d,"Unavailable","error");}
        }
        completed++;
        updateProgress(completed,total);
      }
      status.textContent="✅ Done. See details below.";
      status.className="success";
    }
  </script>
</body>
</html>
