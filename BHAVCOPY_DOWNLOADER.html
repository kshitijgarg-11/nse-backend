<body>
  <div class="container">
    <h1>NSE F&amp;O Bhavcopy Downloader</h1>

    <!-- Single Date -->
    <section>
      <h2>Single Date</h2>
      <label for="singleDate">Pick a Date</label>
      <input type="date" id="singleDate" max="">
      <button onclick="downloadSingle()">Download</button>
    </section>

    <!-- Date Range -->
    <section>
      <h2>Date Range</h2>
      <label for="fromDate">From</label>
      <input type="date" id="fromDate" max="">
      <label for="toDate">To</label>
      <input type="date" id="toDate" max="">
      <button onclick="downloadRange()">Download Range</button>
    </section>

    <!-- Arbitrary Dates -->
    <section>
      <h2>Arbitrary Dates</h2>
      <label for="pickDate">Select Date</label>
      <input type="date" id="pickDate" max="">
      <button onclick="addDate()">Add</button>
      <div id="datesList">(No dates added)</div>
      <button class="btn-download" onclick="downloadArbitrary()">Download Selected Dates</button>
    </section>

    <div id="status"></div>
  </div>

  <footer>
    © 2025 Your Trading Firm. All rights reserved.
  </footer>

  <script>
    // API Base
    const API_BASE = "/api/fno-bhavcopy";

    // Limit max to today
    const today = new Date().toISOString().split("T")[0];
    ["singleDate", "fromDate", "toDate", "pickDate"].forEach(id => {
      document.getElementById(id).max = today;
    });

    const status = document.getElementById("status");

    // Helpers
    async function fetchAndDownload(dateStr) {
      const url = `${API_BASE}?date_str=${dateStr}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Unavailable: ${dateStr}`);
      const blob = await response.blob();
      const downloadUrl = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = downloadUrl;
      a.download = `fno_bhavcopy_${dateStr}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function formatDate(date) {
      return date.toISOString().split("T")[0];
    }

    // 1. Single Date
    async function downloadSingle() {
      const date = document.getElementById("singleDate").value;
      if (!date) {
        status.textContent = "⚠️ Select a date.";
        status.className = "error";
        return;
      }
      try {
        status.textContent = "⏳ Fetching...";
        status.className = "loading";
        await fetchAndDownload(date);
        status.textContent = "✅ Download complete.";
        status.className = "success";
      } catch (err) {
        status.textContent = `❌ ${err.message}`;
        status.className = "error";
      }
    }

    // 2. Date Range
    async function downloadRange() {
      const fromDate = document.getElementById("fromDate").value;
      const toDate = document.getElementById("toDate").value;

      if (!fromDate || !toDate) {
        status.textContent = "⚠️ Select both dates.";
        status.className = "error";
        return;
      }

      const from = new Date(fromDate);
      const to = new Date(toDate);

      if (from > to) {
        status.textContent = "⚠️ From Date cannot be after To Date.";
        status.className = "error";
        return;
      }

      let current = new Date(from);
      let count = 0;
      status.textContent = "⏳ Downloading range...";
      status.className = "loading";

      try {
        while (current <= to) {
          const dateStr = formatDate(current);
          try {
            await fetchAndDownload(dateStr);
            count++;
          } catch (err) {
            console.warn(err.message);
          }
          current.setDate(current.getDate() + 1);
        }
        status.textContent = `✅ Downloaded ${count} file(s).`;
        status.className = "success";
      } catch (err) {
        status.textContent = "❌ Failed.";
        status.className = "error";
      }
    }

    // 3. Arbitrary Dates
    let selectedDates = [];

    function addDate() {
      const date = document.getElementById("pickDate").value;
      if (!date) return;
      if (!selectedDates.includes(date)) {
        selectedDates.push(date);
      }
      updateDatesList();
    }

    function updateDatesList() {
      const listEl = document.getElementById("datesList");
      if (selectedDates.length === 0) {
        listEl.textContent = "(No dates added)";
      } else {
        listEl.innerHTML = selectedDates.map(d => `<span>${d}</span>`).join(" ");
      }
    }

    async function downloadArbitrary() {
      if (selectedDates.length === 0) {
        status.textContent = "⚠️ No dates selected.";
        status.className = "error";
        return;
      }

      status.textContent = "⏳ Downloading files...";
      status.className = "loading";

      let count = 0;
      for (const date of selectedDates) {
        try {
          await fetchAndDownload(date);
          count++;
        } catch (err) {
          console.warn(err.message);
        }
      }
      status.textContent = `✅ Downloaded ${count} file(s).`;
      status.className = "success";
    }
  </script>
