<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSE F&O Bhavcopy Downloader</title>
  <style>
    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121212;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      color: #e0e0e0;
    }
    .container {
      background: #1e1e1e;
      padding: 2rem 3rem;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      max-width: 600px;
      width: 95%;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 1.2rem;
      color: #f5f5f5;
    }
    section {
      margin: 1.5rem 0;
      padding: 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: #181818;
      text-align: left;
    }
    h2 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #e0e0e0;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #bbbbbb;
    }
    input[type="date"] {
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #444;
      border-radius: 6px;
      margin-bottom: 0.6rem;
      background: #2a2a2a;
      color: #ddd;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
    button {
      background: linear-gradient(90deg, #0057b8, #003f88);
      color: white;
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.3s ease;
      margin-top: 0.5rem;
    }
    button:hover {
      opacity: 0.85;
    }
    .btn-download {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 1rem;
      font-size: 1rem;
    }
    #datesList {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #ddd;
    }
    #datesList span {
      display: inline-block;
      background: #333;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      margin: 0.2rem;
    }
    #status {
      margin-top: 1rem;
      font-size: 0.95rem;
      min-height: 20px;
      text-align: center;
    }
    #status.loading { color: #ffb74d; }
    #status.success { color: #66bb6a; }
    #status.error { color: #ef5350; }
    .progress-container {
      width: 100%;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 1rem;
    }
    .progress-bar {
      height: 20px;
      width: 0%;
      background: #4caf50;
      text-align: center;
      font-size: 0.8rem;
      color: white;
      transition: width 0.3s;
    }
    #statusList {
      margin-top: 1rem;
      text-align: left;
      font-size: 0.85rem;
      max-height: 200px;
      overflow-y: auto;
    }
    #statusList div.success { color: #66bb6a; }
    #statusList div.skipped { color: #888; }
    #statusList div.error { color: #ef5350; }
    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NSE F&O Bhavcopy Downloader</h1>

    <!-- Single Date -->
    <section>
      <h2>Single Date</h2>
      <label for="singleDate">Pick a Date</label>
      <input type="date" id="singleDate" max="">
      <button onclick="downloadSingle()">Download</button>
    </section>

    <!-- Date Range -->
    <section>
      <h2>Date Range</h2>
      <label for="fromDate">From</label>
      <input type="date" id="fromDate" max="">
      <label for="toDate">To</label>
      <input type="date" id="toDate" max="">
      <button onclick="downloadRange()">Download Range</button>
    </section>

    <!-- Arbitrary Dates -->
    <section>
      <h2>Arbitrary Dates</h2>
      <label for="pickDate">Select Date</label>
      <input type="date" id="pickDate" max="">
      <button onclick="addDate()">Add</button>
      <div id="datesList">(No dates added)</div>
      <button class="btn-download" onclick="downloadArbitrary()">Download Selected Dates</button>
    </section>

    <div id="status"></div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>
    <div id="statusList"></div>
  </div>

  <footer>
    © 2025 Your Trading Firm. All rights reserved.
  </footer>

  <script>
    const API_BASE = "/api/fno-bhavcopy";
    const today = new Date().toISOString().split("T")[0];
    ["singleDate", "fromDate", "toDate", "pickDate"].forEach(id => {
      document.getElementById(id).max = today;
    });

    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const statusList = document.getElementById("statusList");

    function updateProgress(completed, total) {
      const percent = Math.round((completed / total) * 100);
      progressBar.style.width = percent + "%";
      progressBar.textContent = percent + "%";
    }

    function addStatus(date, msg, cls) {
      const row = document.createElement("div");
      row.textContent = `${date}: ${msg}`;
      row.className = cls;
      statusList.appendChild(row);
    }

    function formatDate(date) {
      return date.toISOString().split("T")[0];
    }

    async function fetchAndDownload(dateStr) {
      const response = await fetch(`${API_BASE}?date_str=${dateStr}`);
      if (!response.ok) throw new Error("Unavailable");
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `fno_bhavcopy_${dateStr}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    // ---- SINGLE DATE ----
    async function downloadSingle() {
      const date = document.getElementById("singleDate").value;
      if (!date) return;
      try {
        status.textContent = "⏳ Fetching...";
        status.className = "loading";
        await fetchAndDownload(date);
        status.textContent = "✅ Download complete.";
        status.className = "success";
      } catch {
        status.textContent = "❌ File unavailable.";
        status.className = "error";
      }
    }

    // ---- RANGE ----
    async function downloadRange() {
      const fromDate = document.getElementById("fromDate").value;
      const toDate = document.getElementById("toDate").value;
      if (!fromDate || !toDate) return;

      const from = new Date(fromDate);
      const to = new Date(toDate);
      if (from > to) return;

      let current = new Date(from);
      const dates = [];
      while (current <= to) {
        dates.push(formatDate(current));
        current.setDate(current.getDate() + 1);
      }

      await batchDownload(dates);
    }

    // ---- ARBITRARY ----
    let selectedDates = [];
    function addDate() {
      const d = document.getElementById("pickDate").value;
      if (d && !selectedDates.includes(d)) {
        selectedDates.push(d);
      }
      updateDatesList();
    }
    function updateDatesList() {
      const el = document.getElementById("datesList");
      el.innerHTML = selectedDates.length
        ? selectedDates.map(d => `<span>${d}</span>`).join(" ")
        : "(No dates added)";
    }
    async function downloadArbitrary() {
      if (selectedDates.length === 0) return;
      await batchDownload(selectedDates);
    }

    // ---- BATCH DOWNLOAD WITH PROGRESS ----
    async function batchDownload(dates) {
      progressBar.style.width = "0%";
      progressBar.textContent = "0%";
      statusList.innerHTML = "";
      status.textContent = "⏳ Downloading...";
      status.className = "loading";

      let completed = 0;
      const total = dates.length;

      for (const d of dates) {
        const day = new Date(d).getDay();
        if (day === 0 || day === 6) { // Weekend
          addStatus(d, "Skipped (Weekend)", "skipped");
        } else {
          try {
            await fetchAndDownload(d);
            addStatus(d, "Downloaded", "success");
          } catch {
            addStatus(d, "Unavailable", "error");
          }
        }
        completed++;
        updateProgress(completed, total);
      }

      status.textContent = "✅ Done. See details below.";
      status.className = "success";
    }
  </script>
</body>
</html>
